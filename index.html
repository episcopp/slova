<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слова — тренажер</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Слова">
<link rel="icon" type="image/png" href="icon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#ffffff; --text:#4b4b4b; --muted:#777777; --line:#e5e5e5;
  --green:#58cc02; --green-d:#58a700; --blue:#1cb0f6; --blue-d:#1899d6;
  --red:#ff4b4b; --red-d:#ea2b2b; --gold:#ffc800;
  --ok-bg:#d7ffb8; --ok-text:#58a700; --bad-bg:#ffdfe0; --bad-text:#ea2b2b;
  --dis:#e5e5e5; --dis-text:#afafaf; --bar:#e5e5e5; --ghost-text:#1cb0f6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131f24; --surface:#1f2c33; --text:#dce6ea; --muted:#8aa0a8; --line:#37464f;
    --ok-bg:#1f2c33; --ok-text:#89e219; --bad-bg:#1f2c33; --bad-text:#ff7878;
    --dis:#37464f; --dis-text:#5a6d76; --bar:#37464f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131f24; --surface:#1f2c33; --text:#dce6ea; --muted:#8aa0a8; --line:#37464f;
  --ok-bg:#1f2c33; --ok-text:#89e219; --bad-bg:#1f2c33; --bad-text:#ff7878;
  --dis:#37464f; --dis-text:#5a6d76; --bar:#37464f;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:700;font-size:17px;line-height:1.4}
button,select,input,textarea{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.logo{font-size:30px;font-weight:900;color:var(--green);letter-spacing:-.01em}
.streak{font-weight:900;color:#ff9600;font-size:19px}
.hright{display:flex;align-items:center;gap:6px}
.hright .icon{font-size:22px}
.pad{padding:8px 20px 28px;display:flex;flex-direction:column;gap:22px}
.lbl{display:block;font-weight:800;color:var(--muted);margin-bottom:8px;font-size:15px}
.select{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-weight:800;font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats div{border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column}
.stats b{font-size:30px;font-weight:900;color:var(--blue);line-height:1.1}
.stats span{color:var(--muted);font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);padding:12px;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.note{margin:10px 0 0;font-size:15px;color:var(--muted);font-weight:600}
.warn{color:var(--bad-text)}
.actions{display:flex;flex-direction:column;gap:12px}

.btn{border:0;border-bottom:4px solid var(--d,#ccc);background:var(--c,#ccc);color:#fff;border-radius:16px;padding:14px 20px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-size:16px;width:100%;transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-top:2px}
.btn.green{--c:var(--green);--d:var(--green-d)}
.btn.blue{--c:var(--blue);--d:var(--blue-d)}
.btn.red{--c:var(--red);--d:var(--red-d)}
.btn.ghost{background:transparent;color:var(--ghost-text);border:2px solid var(--line);border-bottom-width:4px}
.btn.small{width:auto;padding:10px 16px;font-size:14px}
.btn:disabled{background:var(--dis);border-bottom-color:transparent;color:var(--dis-text);cursor:not-allowed}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);font-size:26px;line-height:1;padding:6px 10px;border-radius:12px}
.spk{background:none;border:0;cursor:pointer;color:var(--blue);padding:6px;border-radius:10px;display:inline-flex;vertical-align:middle}

.top{display:flex;align-items:center;gap:14px;padding:18px 20px 8px}
.bar{flex:1;height:16px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease;position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:99px}
.body{flex:1;padding:16px 20px 24px;display:flex;flex-direction:column;gap:20px}
.ask{font-size:26px;font-weight:900;margin:8px 0 0;color:var(--text)}
.kicker{font-size:15px;font-weight:800;color:var(--muted);margin-top:-8px}
.bubble{border:2px solid var(--line);border-radius:18px;padding:18px 20px;font-size:26px;font-weight:800;display:inline-block;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px}
.mic{width:104px;height:104px;border-radius:50%;border:0;border-bottom:6px solid var(--blue-d);background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer}
.mic:active{transform:translateY(3px);border-bottom-width:3px}
.mic.on{background:var(--red);border-bottom-color:var(--red-d);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,75,.45)}100%{box-shadow:0 0 0 26px rgba(255,75,75,0)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}.bar i{transition:none}}
.live{min-height:28px;font-size:20px;text-align:center;color:var(--text);font-weight:800}
.hint{color:var(--muted);text-align:center;font-weight:600;font-size:15px;margin:0}
.input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-weight:700;font-size:17px}
.input:focus{border-color:var(--blue);outline:none}
.field{width:100%;min-height:96px;border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);font-size:22px;font-weight:700;resize:none}
.field:focus{border-color:var(--blue);outline:none}
.acc{display:flex;flex-wrap:wrap;gap:8px}
.acc button{min-width:42px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);padding:6px 10px;font-weight:800;font-size:18px;cursor:pointer}
.said{color:var(--muted);font-size:16px;font-weight:600}
.bank-top{display:flex;gap:12px;align-items:flex-start}
.anslines{flex:1;min-height:112px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;background:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 56px)}
.tile{height:48px;padding:0 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-size:19px;font-weight:800;cursor:pointer}
.anslines .tile{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile.ghost{background:var(--dis);border-color:transparent;color:transparent;cursor:default;pointer-events:none}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px;margin-top:22px}
.kbtoggle{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--dis);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.kbrow{display:flex;gap:12px;align-items:flex-start}
.kbrow .field{flex:1;width:auto;min-width:0}

.dock{position:fixed;left:0;right:0;bottom:var(--kb,0px);width:100%;max-width:640px;margin:0 auto;z-index:5;background:var(--bg);
  padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px;
  transition:bottom .28s cubic-bezier(.2,.8,.2,1),background-color .15s}
html.kb .dock{padding-bottom:16px}
@media (prefers-reduced-motion: reduce){.dock{transition:none}}
.dock.ok{background:var(--ok-bg);border-top-color:transparent}
.dock.bad{background:var(--bad-bg);border-top-color:transparent}
.dock .msg{display:flex;flex-direction:column;gap:2px}
.dock .t{font-size:22px;font-weight:900}
.dock.ok .t{color:var(--ok-text)}
.dock.bad .t{color:var(--bad-text)}
.dock .a{font-size:18px;font-weight:800}
.dock.ok .a{color:var(--ok-text)}
.dock.bad .a{color:var(--bad-text)}
.dock .sub{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;cursor:pointer;font-weight:800;text-decoration:underline;color:inherit}

textarea.paste{width:100%;min-height:240px;border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);font-size:17px;font-weight:600;resize:vertical}
textarea.paste:focus{border-color:var(--blue);outline:none}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--green)}
.file{font-size:15px;font-weight:600}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.row .w{flex:1;min-width:0;overflow-wrap:anywhere}
.row .w small{display:block;color:var(--muted);font-weight:600;font-size:15px}
.pips{color:var(--green);letter-spacing:2px;font-size:13px;white-space:nowrap}
.done-h{font-size:32px;font-weight:900;color:var(--gold);margin:12px 0 0;text-align:center}
.big{display:flex;justify-content:center;gap:16px}
.big div{border:2px solid var(--line);border-radius:16px;padding:14px 22px;text-align:center}
.big b{display:block;font-size:30px;font-weight:900;color:var(--blue)}
.big span{color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90%;text-align:center;z-index:9}
.confetti{position:fixed;top:50%;left:50%;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:9;animation:confetti-burst .95s ease-out forwards}
@keyframes confetti-burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.4) rotate(var(--rot));opacity:0}}
@keyframes shake-bad{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.bubble.shake{animation:shake-bad .5s ease;border-color:var(--red)}
@media (prefers-reduced-motion: reduce){.confetti,.bubble.shake{animation:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const LANGS=[
  {code:'it-IT',name:'Італійська',adv:'італійською'},
  {code:'en-US',name:'Англійська',adv:'англійською'},
  {code:'fr-FR',name:'Французька',adv:'французькою'},
  {code:'de-DE',name:'Німецька',adv:'німецькою'},
  {code:'es-ES',name:'Іспанська',adv:'іспанською'},
  {code:'pt-PT',name:'Португальська',adv:'португальською'},
  {code:'pl-PL',name:'Польська',adv:'польською'}
];
const ART={
  it:/^(?:(?:il|lo|la|i|gli|le|un|uno|una)\s+|l'|un')/,
  fr:/^(?:(?:le|la|les|un|une|des)\s+|l')/,
  es:/^(?:(?:el|la|los|las|un|una)\s+)/,
  de:/^(?:(?:der|die|das|ein|eine)\s+)/,
  en:/^(?:(?:the|a|an|to)\s+)/,
  pt:/^(?:(?:o|a|os|as|um|uma)\s+)/
};
const ACC={it:'àèéìòù',fr:'àâçéèêëîïôùûü',es:'áéíóúñü',de:'äöüß',pl:'ąćęłńóśźż',pt:'áàâãçéêíóôõú'};
const KEY='slova_trainer_v1';
// Оновлюється при кожному залитті на GitHub: версія і дата/час (за Римом).
const APP_VERSION='2.4',APP_UPDATED='24.11.2026 09:40';
const ROUND=10;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* ---------- storage ---------- */
const blank=()=>({lang:'it-IT',mode:'speak',theme:'auto',sound:true,conjTense:'pres',words:{},tomb:{},streak:{last:'',n:0}});
let store=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r){return Object.assign(blank(),JSON.parse(r));}}catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
const cur=()=>{if(!store.words[store.lang])store.words[store.lang]=[];return store.words[store.lang];};
const langInfo=()=>LANGS.find(l=>l.code===store.lang)||LANGS[0];
const short=()=>store.lang.slice(0,2);

/* ---------- theme ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(store.theme==='dark'||store.theme==='light')r.setAttribute('data-theme',store.theme);else r.removeAttribute('data-theme');
}
const isDark=()=>store.theme==='dark'||(store.theme!=='light'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);

/* ---------- sounds (synthesized, no audio files) ---------- */
let actx=null;
function audio(){
  try{
    if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}
    if(actx&&actx.state==='suspended')actx.resume();
  }catch(e){}
  return actx;
}
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{audio();},{passive:true}));
function playSound(kind){
  if(store.sound===false)return;
  const ctx=audio();if(!ctx)return;
  try{
    const now=ctx.currentTime+0.02;
    const note=(f,t,d,type,g,lp)=>{
      const o=ctx.createOscillator(),gn=ctx.createGain();
      o.type=type;o.frequency.setValueAtTime(f,now+t);
      gn.gain.setValueAtTime(0.0001,now+t);
      gn.gain.exponentialRampToValueAtTime(g,now+t+0.015);
      gn.gain.exponentialRampToValueAtTime(0.0001,now+t+d);
      if(lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(gn);}else o.connect(gn);
      gn.connect(ctx.destination);o.start(now+t);o.stop(now+t+d+0.05);
    };
    if(kind==='ok'){
      note(784,0,.16,'sine',.22);note(1568,0,.16,'sine',.05);
      note(1175,.09,.42,'sine',.24);note(2350,.09,.3,'sine',.05);
    }else if(kind==='bad'){
      note(247,0,.2,'triangle',.28,900);note(185,.17,.34,'triangle',.28,700);
    }else if(kind==='done'){
      [523,659,784,1047].forEach((f,i)=>note(f,i*.11,.4,'sine',.2));
      note(1047,.44,.6,'sine',.2);note(1319,.44,.6,'sine',.1);
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const ICON_KB='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>';
const ICON_TILES='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg>';
const ICON_MIC='<svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
const ICON_SPK='<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
const ICON_IDK='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 1 2.64 6.36"/><path d="M3 21v-5h5"/></svg>';
let toastT=null;
function toast(msg){
  let t=$('.toast');if(t)t.remove();
  t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),4200);
}
const VOICE_SAMPLE={it:'Ciao, come stai? Questa è la mia voce.',en:'Hello, how are you? This is my voice.',fr:'Bonjour, comment ça va ? Voici ma voix.',de:'Hallo, wie geht es dir? Das ist meine Stimme.',es:'Hola, ¿cómo estás? Esta es mi voz.',pt:'Olá, como está? Esta é a minha voz.',pl:'Cześć, jak się masz? To jest mój głos.'};

/* ElevenLabs is an optional, higher-quality cloud voice. The API key never leaves this
   device: it lives only in this browser's localStorage, outside the synced word store,
   so it is never written to Firestore or sent anywhere except api.elevenlabs.io. */
const ELEVEN_KEY_LS='slova_eleven_key';
function elevenKey(){try{return localStorage.getItem(ELEVEN_KEY_LS)||'';}catch(e){return '';}}
function setElevenKey(k){try{k?localStorage.setItem(ELEVEN_KEY_LS,k):localStorage.removeItem(ELEVEN_KEY_LS);}catch(e){}}
function voiceFor(lang){
  const v=store.voice&&store.voice[lang||store.lang];
  if(!v)return null;
  return typeof v==='string'?{provider:'browser',name:v}:v;
}
function pickVoice(lang){
  const v=voiceFor(lang);
  if(!v||v.provider!=='browser')return null;
  try{return speechSynthesis.getVoices().find(x=>x.name===v.name)||null;}catch(e){return null;}
}
function sayBrowser(text,voiceName){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang=store.lang;u.rate=.9;
    const vv=voiceName?speechSynthesis.getVoices().find(x=>x.name===voiceName):pickVoice();
    if(vv)u.voice=vv;
    speechSynthesis.speak(u);
  }catch(e){}
}
let curAudio=null;const elevenCache=new Map();
async function sayEleven(text,voiceId){
  const key=elevenKey();
  if(!key||!voiceId)return sayBrowser(text);
  try{
    if(curAudio){curAudio.pause();curAudio=null;}
    const ck=voiceId+'|'+text;
    let url=elevenCache.get(ck);
    if(!url){
      const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+encodeURIComponent(voiceId),{
        method:'POST',
        headers:{'xi-api-key':key,'Content-Type':'application/json','Accept':'audio/mpeg'},
        body:JSON.stringify({text,model_id:'eleven_multilingual_v2'})
      });
      if(!r.ok){
        let msg='Не вдалося озвучити через ElevenLabs.';
        if(r.status===401)msg='Невірний ключ ElevenLabs.';
        else if(r.status===429)msg='Вичерпано ліміт ElevenLabs на цей місяць.';
        toast(msg+' Поки що озвучую голосом браузера.');
        return sayBrowser(text);
      }
      const blob=await r.blob();url=URL.createObjectURL(blob);elevenCache.set(ck,url);
    }
    curAudio=new Audio(url);curAudio.play().catch(()=>{});
  }catch(e){
    toast('Немає зв’язку з ElevenLabs. Поки що озвучую голосом браузера.');
    sayBrowser(text);
  }
}
async function fetchElevenVoices(key){
  const r=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':key}});
  if(!r.ok){
    const e=new Error('http');e.code=r.status===401?'bad-key':'other';throw e;
  }

/* ---------- answer matching ---------- */
function normText(s,acc){
  let x=String(s).normalize('NFC').toLowerCase().replace(/[’‘`´ʼ]/g,"'");
  if(!acc)x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  x=x.replace(/[^\p{L}\p{N}' ]/gu,' ').replace(/\s+/g,' ').trim();
  return x;
}
const compact=s=>s.replace(/[' ]/g,'');
function variants(tl){
  const out=new Set();
  for(const part of tl.split('/')){
    const p=part.trim();if(!p)continue;
    out.add(p);out.add(p.replace(/\([^)]*\)/g,' '));out.add(p.replace(/[()]/g,''));
  }
  return out;
}
function keySet(tl,acc){
  const keys=new Set(),art=ART[short()];
  for(const v of variants(tl)){
    const n=normText(v,acc);if(!n)continue;
    keys.add(compact(n));
    if(art){const s=n.replace(art,'');if(s&&s!==n)keys.add(compact(s));}
  }
  return keys;
}
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function near(k,set,minLen){
  for(const c of set){if(Math.min(k.length,c.length)>=minLen&&lev(k,c)<=1)return true;}
  return false;
}
function judgeSpeech(alts,tl){
  const keys=keySet(tl,false);let close=false;
  for(const a of alts){
    const k=compact(normText(a,false));if(!k)continue;
    if(keys.has(k))return{kind:'ok'};
    if(near(k,keys,6))close=true;
  }
  return close?{kind:'ok',note:'Майже ідеально — перевірте вимову.'}:{kind:'bad'};
}
function judgeType(input,tl){
  const strict=compact(normText(input,true));
  if(keySet(tl,true).has(strict))return{kind:'ok'};
  const loose=compact(normText(input,false));
  const lk=keySet(tl,false);
  if(lk.has(loose))return{kind:'bad',note:'Майже! Перевірте діакритику (наголоси, апострофи).'};
  if(near(loose,lk,4))return{kind:'bad',note:'Майже! Є одруківка.'};
  return{kind:'bad'};
}

/* ---------- import parsing ---------- */
const CYR=/[\u0400-\u04FF]/;
const SEPS=[/\t/,/\s*;\s*/,/\s+[-–—]\s+/,/\s*=\s*/,/\s*\|\s*/,/\s*,\s*/];
function parsePairs(text,foreignFirst){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim().replace(/^\d+\s*[.)]\s+/,'');if(!line)continue;
    for(const sep of SEPS){
      const m=line.match(sep);
      if(m){
        let a=line.slice(0,m.index).trim(),b=line.slice(m.index+m[0].length).trim();
        a=a.replace(/^["']|["']$/g,'');b=b.replace(/^["']|["']$/g,'');
        if(a&&b){
          const ca=CYR.test(a),cb=CYR.test(b);
          if(ca&&!cb)out.push({uk:a,tl:b});
          else if(cb&&!ca)out.push({uk:b,tl:a});
          else out.push(foreignFirst?{uk:b,tl:a}:{uk:a,tl:b});
        }
        break;
      }
    }
  }
  return out;
}

/* ---------- PDF import ---------- */
const PDFJS_BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLoad=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(!pdfLoad)pdfLoad=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=PDFJS_BASE+'pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js';res();};
    s.onerror=()=>{pdfLoad=null;rej(new Error('pdfjs'));};
    document.head.appendChild(s);
  });
  return pdfLoad;
}
async function pdfToText(file){
  await loadPdfJs();
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await(await pdf.getPage(p)).getTextContent();
    const rows=[];
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      const x=it.transform[4],y=it.transform[5];
      let row=rows.find(r=>Math.abs(r.y-y)<3);
      if(!row){row={y,items:[]};rows.push(row);}
      row.items.push({x,w:it.width,s:it.str.trim()});
    }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){
      r.items.sort((a,b)=>a.x-b.x);
      let line='',end=null;
      for(const it of r.items){
        if(end!==null){const gap=it.x-end;line+=gap>12?'\t':(gap>1?' ':'');}
        line+=it.s;end=it.x+it.w;
      }
      lines.push(line);
    }
  }
  return lines.join('\n');
}

function mergeRemote(rm){

  for(const k of Object.keys(store.tomb||{}))tomb[k]=Math.max(tomb[k]||0,store.tomb[k]);
  const langs=new Set([...Object.keys(store.words),...Object.keys(rm.words||{})]);
  const out={};
  for(const lg of langs){
    const map=new Map();
    for(const w of (store.words[lg]||[]))map.set(wkey(w),w);
    for(const w of ((rm.words||{})[lg]||[])){
      const k=wkey(w),l=map.get(k);
      if(!l){map.set(k,Object.assign({},w,{id:w.id||Date.now().toString(36)+Math.random().toString(36).slice(2,7)}));}

        if((w.last||0)>(l.last||0)){l.lvl=w.lvl;l.ok=w.ok;l.bad=w.bad;l.err=w.err;l.last=w.last;}
        l.t0=Math.max(l.t0||0,w.t0||0);

   1) registers a service worker (firebase-messaging-sw.js) that can receive a push while closed,
   2) asks Firebase for a device "push token",
   3) saves that token (plus which language to quiz) on this user's Firestore document, so the
      scheduled job knows where to send the next word.
   On iPhone, Web Push only works once the site is added to the Home Screen and opened from
   there (iOS 16.4+) — Safari itself (as a normal browser tab) cannot receive push at all. */
const PUSH_VAPID_LS='slova_vapid',LOG_KEY='slova_log';
function logErr(step,e){
  try{
    const a=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');
    a.push({t:new Date().toISOString(),step:step||'',code:(e&&e.code)||'',name:(e&&e.name)||'',msg:String((e&&e.message)||e||''),stack:String((e&&e.stack)||'').slice(0,500)});
    localStorage.setItem(LOG_KEY,JSON.stringify(a.slice(-30)));
  }catch(x){}
}
function readLog(){try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){return [];}}
function logText(){
  const env=`Версія ${APP_VERSION} (${APP_UPDATED})\nstandalone=${isStandalone()} perm=${('Notification' in window)?Notification.permission:'n/a'} sw=${'serviceWorker' in navigator} push=${'PushManager' in window}\nUA: ${navigator.userAgent}`;
  const items=readLog().map(x=>`${x.t} [${x.step}] ${x.code||x.name}: ${x.msg}${x.stack?'\n'+x.stack:''}`).join('\n\n');
  return env+(items?'\n\n'+items:'\n\n(журнал порожній)');
}
window.addEventListener('error',e=>logErr('global',e.error||{message:e.message}));
window.addEventListener('unhandledrejection',e=>logErr('promise',e.reason));
const BUILT_IN_VAPID='BDMC4OFB_liKtVkEGhd4KRyYT5yr46HNROJ7ZH8n1q8DjFsbseZVkf493QA848XP9MCfnm0KsjZ4TWJCMXx3M0A';
function vapidKey(){if(BUILT_IN_VAPID)return BUILT_IN_VAPID;try{return localStorage.getItem(PUSH_VAPID_LS)||cloud.vapidKey||'';}catch(e){return cloud.vapidKey||'';}}
function setVapidKey(k){cloud.vapidKey=k||'';saveCloud();}
function isStandalone(){
  try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}catch(e){return false;}
}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}
async function registerPushSW(){
  const c=cfg();
  const qs='apiKey='+encodeURIComponent(c.apiKey)+'&projectId='+encodeURIComponent(c.projectId)+
    '&messagingSenderId='+encodeURIComponent(c.messagingSenderId)+'&appId='+encodeURIComponent(c.appId);
  return navigator.serviceWorker.register('firebase-messaging-sw.js?'+qs);
}
async function enablePush(vkey){
  let step='start';
  try{
    step='load-messaging-sdk';
    if(!window.firebase||!window.firebase.messaging){
      await loadScript(FB_BASE+'firebase-messaging-compat.js');
    }
    step='permission';
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){const e=new Error('denied');e.code='denied';throw e;}
    step='register-service-worker';
    const reg=await registerPushSW();
    step='wait-service-worker-active';
    await navigator.serviceWorker.ready;
    step='init-firebase';
    await initFirebase();
    step='get-token';
    const msg=window.firebase.messaging();
    const token=await msg.getToken({vapidKey:vkey,serviceWorkerRegistration:reg});
    if(!token){const e=new Error('notoken');e.code='notoken';throw e;}
    step='current-user';
    const u=await currentUser();
    if(!u){const e=new Error('nosession');e.code='nosession';throw e;}
    step='save-token-firestore';
    await window.firebase.firestore().collection('users').doc(u.uid).set({pushToken:token,pushLang:store.lang,pushTz:(Intl.DateTimeFormat().resolvedOptions().timeZone||'')},{merge:true});
    cloud.pushOn=true;cloud.pushLang=store.lang;cloud.pushToken=token;saveCloud();
  }catch(e){
    e.step=step;logErr(step,e);throw e;
  }
}
async function disablePush(){
  try{
    if(window.firebase&&window.firebase.messaging){
      const reg=await navigator.serviceWorker.getRegistration('firebase-messaging-sw.js');
      if(reg){const msg=window.firebase.messaging();try{await msg.deleteToken();}catch(e){}await reg.unregister();}
    }
  }catch(e){}
  try{
    const u=await currentUser();
    if(u)await window.firebase.firestore().collection('users').doc(u.uid).update({pushToken:window.firebase.firestore.FieldValue.delete(),pushLang:window.firebase.firestore.FieldValue.delete(),pushTz:window.firebase.firestore.FieldValue.delete()});
  }catch(e){}
  cloud.pushOn=false;saveCloud();
}

  };
  $('#logclear').onclick=()=>{try{localStorage.removeItem(LOG_KEY);}catch(e){}renderPush();};
  const pt=$('#ptest');if(pt)pt.onclick=async()=>{

  const pd=$('#pdiag');if(pd)pd.onclick=async()=>{

    try{

      const sub=reg&&await reg.pushManager.getSubscription();

      const c=await caches.open('slova-log'),ks=await c.keys(),rows=[];

function isVerbInf(tl){
  const s=(tl||'').split('/')[0].trim().toLowerCase();
  return /^[a-zàèéìòù]+(are|ere|ire|arsi|ersi|irsi)$/.test(s);
}
function verbList(){return cur().filter(w=>isVerbInf(w.tl));}
function splitVerb(tl){
  const s=(tl||'').split('/')[0].trim().toLowerCase();
  const refl=/(ar|er|ir)si$/.test(s);
  return{core:refl?s.slice(0,-2)+'e':s,refl};
}
function stemEnd(core){return{stem:core.slice(0,-3),end:core.slice(-3)};}
function orthoAdjust(stem,ending,end){
  if(end!=='are'||!/^[ei]/.test(ending))return stem+ending;
  if(/ci$|gi$/.test(stem))return stem.slice(0,-1)+ending;
  if(/c$|g$/.test(stem))return stem+'h'+ending;
  return stem+ending;
}
function presenteRegular(core){
  const{stem,end}=stemEnd(core);
  if(end==='ire'&&ISC.has(core))return PRES_END_ISC.map(e=>stem+e);
  return PRES_END[end].map(e=>orthoAdjust(stem,e,end));
}
function futuroStem(core){
  const{stem,end}=stemEnd(core);
  if(end==='ire')return stem+'ir';
  if(/ci$|gi$/.test(stem))return stem.slice(0,-1)+'er';
  if(/c$|g$/.test(stem))return stem+'her';
  return stem+'er';
}
function presenteForms(core){const irr=IRR[core];return(irr&&irr.pres)?irr.pres.slice():presenteRegular(core);}
function futuroForms(core){const irr=IRR[core];const stem=(irr&&irr.fut)?irr.fut:futuroStem(core);return FUT_END.map(e=>stem+e);}
function participio(core){
  const irr=IRR[core];if(irr&&irr.part)return irr.part;
  const{stem,end}=stemEnd(core);
  return stem+(end==='are'?'ato':end==='ere'?'uto':'ito');
}
function passatoForms(core,forceEssere){
  const useEssere=forceEssere||AUX_ESSERE.has(core),p=participio(core),aux=useEssere?ESSERE:AVERE;
  return aux.map((a,i)=>{
    if(!useEssere)return a+' '+p;
    const pm=p,pf=p.replace(/o$/,'a'),pmpl=p.replace(/o$/,'i'),pfpl=p.replace(/o$/,'e');
    return i<3?(a+' '+pm+' / '+a+' '+pf):(a+' '+pmpl+' / '+a+' '+pfpl);
  });
}
function conjugate(tl,tense){
  const{core,refl}=splitVerb(tl);
  let forms=tense==='pres'?presenteForms(core):tense==='fut'?futuroForms(core):passatoForms(core,refl);
  if(refl){const PRON=['mi','ti','si','ci','vi','si'];forms=forms.map((f,i)=>f.split('/').map(s=>PRON[i]+' '+s.trim()).join(' / '));}
  return forms;
}

function startConj(){

  const tense=store.conjTense||'pres',pool=['pres','fut','pp'];
  const items=[];
  for(const v of verbs)for(let p=0;p<6;p++)items.push({vid:v.id,p,t:tense==='mix'?pool[Math.floor(Math.random()*3)]:tense});
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  L={kind:'conj',queue:items.slice(0,Math.min(ROUND,items.length)),i:0,solved:0,firstOk:0,mist:[],retry:new Set(),stage:'ask',res:null,forceType:false};
  L.total=L.queue.length;

}


/* ---------- word bank (Duolingo-style tiles) ----------
   The answer is built by tapping words from a shuffled set (the right words + distractors taken
   from the user's own word list). The keyboard stays available via the toggle button. */
const bankFirst=s=>String(s).split('/')[0].replace(/\s*\([^)]*\)/g,' ').trim();
function makeBank(item){
  const ans=bankFirst(item.tl).split(/\s+/).filter(Boolean);
  if(!ans.length)return null;
  const nk=x=>normText(x,true),have=new Set(ans.map(nk)),pool=[],seen=new Set();
  for(const w of cur())for(const t of bankFirst(w.tl).split(/\s+/)){
    const k=nk(t);if(k&&!have.has(k)&&!seen.has(k)){seen.add(k);pool.push(t);}
  }
  const avg=ans.reduce((a,t)=>a+t.length,0)/ans.length;
  pool.sort((a,b)=>(Math.abs(a.length-avg)+Math.random()*3)-(Math.abs(b.length-avg)+Math.random()*3));
  const tiles=ans.concat(pool.slice(0,ans.length===1?5:3)).map((t,i)=>({id:i,t}));
  if(tiles.length<3)return null;
  for(let i=tiles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tiles[i],tiles[j]]=[tiles[j],tiles[i]];}
  return{tiles};
}
function bankState(st,item){
  if(st.bankKey!==item.key){st.bankKey=item.key;st.bank=makeBank(item);st.sel=[];}
  return st.bank;
}
function bankInner(st){
  const used=new Set(st.sel),T=id=>st.bank.tiles.find(t=>t.id===id).t;
  return `<div class="bank-top"><div class="anslines">${st.sel.map(id=>`<button type="button" class="tile" data-un="${id}">${esc(T(id))}</button>`).join('')}</div>
    <button type="button" class="kbtoggle" id="tokb" aria-label="Ввести з клавіатури">${ICON_KB}</button></div>
    <div class="tray">${st.bank.tiles.map(t=>used.has(t.id)?`<span class="tile ghost">${esc(t.t)}</span>`:`<button type="button" class="tile" data-pk="${t.id}">${esc(t.t)}</button>`).join('')}</div>`;
}
function bindBank(st,btn,rerender,onSubmit){
  const wrap=$('#bankwrap'),T=id=>st.bank.tiles.find(t=>t.id===id).t;
  const paint=()=>{
    wrap.innerHTML=bankInner(st);btn.disabled=!st.sel.length;
    $$('[data-pk]',wrap).forEach(b=>b.onclick=()=>{st.sel.push(+b.dataset.pk);paint();});
    $$('[data-un]',wrap).forEach(b=>bindDrag(b));
    $('#tokb',wrap).onclick=()=>{store.input='kbd';save();rerender();};
  };
  // Answer tiles: a tap removes the tile, dragging it moves it to another position.
  function bindDrag(el){
    el.onpointerdown=e=>{
      if(e.button>0)return;
      const box=el.parentNode,id=+el.dataset.un,sx=e.clientX,sy=e.clientY;
      let drag=false,gx=0,gy=0;
      const others=()=>[...box.children].filter(c=>c!==el);
      const place=(px,py)=>{
        let idx=0;const list=others();
        list.forEach(o=>{const r=o.getBoundingClientRect();if(py>r.bottom||(py>=r.top&&px>r.left+r.width/2))idx++;});
        const ref=list[idx]||null;
        if(ref!==el.nextSibling&&!(ref===null&&el.nextSibling===null))box.insertBefore(el,ref);
        el.style.transform='';const r=el.getBoundingClientRect();
        el.style.transform=`translate(${px-gx-(r.left+r.width/2)}px,${py-gy-(r.top+r.height/2)}px)`;
      };
      el.onpointermove=ev=>{
        if(!drag){
          if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;
          drag=true;try{el.setPointerCapture(ev.pointerId);}catch(x){}
          const r=el.getBoundingClientRect();gx=sx-(r.left+r.width/2);gy=sy-(r.top+r.height/2);
          el.style.position='relative';el.style.zIndex='5';el.style.opacity='.9';el.style.transition='none';
        }
        place(ev.clientX,ev.clientY);
      };
      const end=ev=>{
        el.onpointermove=el.onpointerup=el.onpointercancel=null;
        if(!drag){if(ev.type==='pointerup'){st.sel=st.sel.filter(x=>x!==id);paint();}return;}
        st.sel=[...box.children].map(c=>+c.dataset.un);paint();
      };
      el.onpointerup=end;el.onpointercancel=end;
    };
  }
  paint();
  btn.onclick=()=>{
    if(!st.sel.length)return;
    const v=st.sel.map(T).join(' ');st.bankKey=null;onSubmit(v);
  };
}

/* ---------- mistakes: words answered wrong (first try) until answered right in the Mistakes mode ---------- */
const isErr=w=>w.err===undefined?(w.bad||0)>0:!!w.err;
function startQuick(){
  const ws=cur();if(!ws.length)return;
  // random word, weaker (lower level) words are more likely
  const wt=ws.map(w=>1/(1+(w.lvl||0))),tot=wt.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot,w=ws[ws.length-1];
  for(let i=0;i<ws.length;i++){r-=wt[i];if(r<=0){w=ws[i];break;}}
  Q={uk:w.uk,tl:w.tl,lang:store.lang,wid:w.id,stage:'ask',res:null};
  go('quick');
}
function startMistakes(){
  const ws=cur().filter(isErr);if(!ws.length)return;
  const picked=ws.map(w=>w.id);
  for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]];}
  const q=picked.slice(0,Math.min(ROUND,picked.length));
  L={kind:'mist',queue:q,i:0,total:q.length,solved:0,firstOk:0,mist:[],retry:new Set(),stage:'ask',res:null,forceType:false,heard:[],interim:''};
  go('lesson');
}

/* ---------- lesson ---------- */
function startLesson(){
  const ws=cur();if(!ws.length)return;
  const now=Date.now();
  const picked=ws.map(w=>({w,s:(w.lvl||0)+Math.random()*1.6+((now-(w.last||0))<600000?2:0)}))
    .sort((a,b)=>a.s-b.s).slice(0,Math.min(ROUND,ws.length)).map(x=>x.w.id);
  for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]];}
  L={queue:picked,i:0,total:picked.length,solved:0,firstOk:0,mist:[],retry:new Set(),stage:'ask',res:null,forceType:false,heard:[],interim:''};
  go('lesson');
}
function curItem(){
  if((L.kind||'vocab')!=='conj'){
    const w=cur().find(x=>x.id===L.queue[L.i]);
    return{uk:w.uk,tl:w.tl,kicker:null,key:w.id,w};
  }
  const it=L.queue[L.i],v=cur().find(x=>x.id===it.vid);
  if(!v)return{uk:'?',tl:'?',kicker:null,key:it.vid+'|'+it.p+'|'+it.t,w:null};
  const forms=conjugate(v.tl,it.t);
  return{uk:PRON_LABEL[it.p],tl:forms[it.p],kicker:v.tl.split('/')[0].trim()+' · '+TENSE_LABEL[it.t],key:v.id+'|'+it.p+'|'+it.t,w:null};
}

function finishAnswer(r){L.bankKey=null;L.res=r;L.stage='result';playSound(r.kind==='ok'?'ok':'bad');renderLesson();}

function commit(){
  const item=curItem(),first=!L.retry.has(item.key),ok=L.res.kind==='ok';
  if(ok){
    L.solved++;
    if(first)L.firstOk++;
  }else{
    if(first)L.mist.push(item);
    L.retry.add(item.key);L.queue.push(L.queue[L.i]);
  }
  if((L.kind||'vocab')!=='conj'&&item.w){
    const w=item.w;
    if(ok&&first){w.lvl=Math.min(5,(w.lvl||0)+1);w.ok=(w.ok||0)+1;if(L.kind==='mist')w.err=0;}
    if(!ok&&first){w.lvl=Math.max(0,(w.lvl||0)-1);w.bad=(w.bad||0)+1;w.err=1;}
    w.last=Date.now();save();
  }
  L.i++;L.stage='ask';L.res=null;L.forceType=false;
  if(L.i>=L.queue.length)finishLesson();else renderLesson();
}

/* ---------- speech recognition ---------- */
let rec=null,listening=false,gotFinal=false;
function stopListen(){
  if(rec){try{rec.onresult=rec.onerror=rec.onend=null;rec.abort();}catch(e){}}
  rec=null;listening=false;
}
function setMic(on){
  const m=$('#mic');if(!m)return;
  m.classList.toggle('on',on);m.setAttribute('aria-pressed',String(on));
}
function setLive(t,hint){
  const l=$('#live'),h=$('#mh');
  if(l&&t!==undefined)l.textContent=t;
  if(h&&hint!==undefined)h.textContent=hint;
}
function toggleMic(){
  if(listening){try{rec.stop();}catch(e){}return;}
  if(!SR)return;
  try{speechSynthesis.cancel();}catch(e){}
  if(curAudio){try{curAudio.pause();}catch(e){}curAudio=null;}
  rec=new SR();rec.lang=store.lang;rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  gotFinal=false;
  rec.onstart=()=>{listening=true;setMic(true);setLive('…','Слухаю…');};
  rec.onresult=e=>{
    const res=e.results[e.results.length-1];
    setLive(res[0].transcript);
    if(res.isFinal){
      gotFinal=true;
      const alts=Array.from(res).map(a=>a.transcript);
      const r=judgeSpeech(alts,curItem().tl);
      r.said=alts[0];r.viaSpeech=true;
      stopListen();finishAnswer(r);
    }
  };
  rec.onerror=e=>{
    const err=e.error;listening=false;setMic(false);
    if(err==='not-allowed'||err==='service-not-allowed'){
      setLive('','Мікрофон заблоковано. Дозвольте доступ у браузері (значок біля адреси) або відкрийте сторінку в окремій вкладці Chrome/Edge. Можна перейти на «Не можу говорити зараз».');
    }else if(err==='no-speech'){setLive('','Не почув голосу. Натисніть на мікрофон і спробуйте ще раз.');}
    else if(err==='audio-capture'){setLive('','Мікрофон не знайдено. Перевірте, чи він підключений.');}
    else if(err==='network'){setLive('','Немає зв’язку із сервісом розпізнавання. Перевірте інтернет.');}
    else if(err!=='aborted'){setLive('','Не вдалося розпізнати. Спробуйте ще раз.');}
  };
  rec.onend=()=>{
    listening=false;setMic(false);
    if(!gotFinal&&$('#live')&&!$('#live').textContent.replace('…','')){setLive(undefined,'Не почув голосу. Натисніть на мікрофон і спробуйте ще раз.');}
  };
  try{rec.start();}catch(e){setLive('','Не вдалося запустити мікрофон. Спробуйте ще раз.');}
}

/* ---------- on-screen keyboard: lift the bottom button above it ---------- */
(function(){
  const vv=window.visualViewport;if(!vv)return;
  // iOS (Safari and third-party keyboards, e.g. extra language/predictive toolbars) sometimes
  // reports the keyboard a bit shorter than what's actually on screen. This constant adds a
  // safety margin on iOS only, so the button clears any such toolbar. Raise it if it's still low.
  const IOS=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.userAgent.includes('Mac')&&navigator.maxTouchPoints>1);
  const IOS_KB_EXTRA=44;
  let raf=0;
  const upd=()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const raw=vv.scale>1.01?0:Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
      const open=raw>80;
      const kb=open&&IOS?raw+IOS_KB_EXTRA:raw;
      document.documentElement.style.setProperty('--kb',(open?kb:0)+'px');
      document.documentElement.classList.toggle('kb',open);
      if(view==='lesson'){const dk=$('.dock');if(dk)app.style.paddingBottom=dk.offsetHeight+'px';}
    });
  };
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);window.addEventListener('orientationchange',upd);upd();
})();

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown',e=>{
  if(view!=='lesson'||!L)return;
  const tag=document.activeElement&&document.activeElement.tagName;
  if(e.key==='Enter'&&!e.shiftKey&&tag!=='BUTTON'){
    const p=$('#primary');if(p&&!p.disabled){e.preventDefault();p.click();}
  }else if(e.key===' '&&L.stage==='ask'&&speakMode()&&tag!=='BUTTON'&&tag!=='TEXTAREA'){
    e.preventDefault();toggleMic();
  }
});

document.addEventListener('visibilitychange',()=>{if(loggedIn())syncNow();});
if('speechSynthesis' in window){try{speechSynthesis.addEventListener('voiceschanged',()=>{if(view==='voice')renderVoice();});speechSynthesis.getVoices();}catch(e){}}
applyTheme();

/* Auto-update: the installed home-screen app caches index.html hard. version.json (always
   fetched fresh) holds the latest version; if it differs from this file's APP_VERSION we reload
   once through a cache-busting URL. Done only on the home screen so a lesson is never cut off. */
async function checkUpdate(){
  try{
    if(view!=='home')return;
    const r=await fetch('version.json?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    if(!j||!j.v||j.v===APP_VERSION)return;
    let tried='';try{tried=sessionStorage.getItem('slova_upd')||'';}catch(e){}
    if(tried===j.v)return;
    try{sessionStorage.setItem('slova_upd',j.v);}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(j.v));
  }catch(e){}
}
try{const u=new URLSearchParams(location.search);if(u.has('v')&&!u.has('notif'))history.replaceState(null,'',location.pathname);}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
setTimeout(checkUpdate,800);

/* If opened from a push-notification tap, jump straight into the single-word screen. */
(function(){
  try{
    const p=new URLSearchParams(location.search);
    if(p.get('notif')==='1'){
      Q={uk:p.get('uk')||'',tl:p.get('tl')||'',lang:p.get('lang')||store.lang,wid:p.get('wid')||'',stage:'ask',res:null};
      view='quick';
      history.replaceState(null,'',location.pathname);
    }
  }catch(e){}
})();
/* If this device already has push enabled and the app happens to be open (foreground) when a
   reminder arrives, show the same single-word screen immediately instead of relying on a tap. */
if(cloud.pushOn&&pushSupported()&&isStandalone()){
  const openQuick=d=>{
    if(!d||!d.uk||!d.tl)return;
    Q={uk:d.uk,tl:d.tl,lang:d.lang||store.lang,wid:d.wid||'',stage:'ask',res:null};
    go('quick');
  };
  // The service worker tells the open app which word to show (on notification tap, or when a push arrives while the app is on screen).
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='quick')openQuick(e.data);});
  // Keep the worker fresh and the device token current (iOS can rotate it); save it again if it changed.
  (async()=>{
    try{
      const reg=await registerPushSW();try{await reg.update();}catch(e){}
      if(!loggedIn())return;
      if(!window.firebase||!window.firebase.messaging)await loadScript(FB_BASE+'firebase-messaging-compat.js');
      await initFirebase();
      const token=await window.firebase.messaging().getToken({vapidKey:vapidKey(),serviceWorkerRegistration:reg});
      const u=await currentUser();
      if(token&&u&&token!==cloud.pushToken){
        await window.firebase.firestore().collection('users').doc(u.uid).set({pushToken:token,pushLang:store.lang,pushTz:(Intl.DateTimeFormat().resolvedOptions().timeZone||'')},{merge:true});
        cloud.pushToken=token;saveCloud();
      }
    }catch(e){logErr('refresh-push',e);}
  })();
}

render();
if(loggedIn())syncNow();
})();
</script>
