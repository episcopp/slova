<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#ffffff; --text:#4b4b4b; --muted:#777777; --line:#e5e5e5;
  --green:#58cc02; --green-d:#58a700; --blue:#1cb0f6; --blue-d:#1899d6;
  --red:#ff4b4b; --red-d:#ea2b2b; --gold:#ffc800;
  --ok-bg:#d7ffb8; --ok-text:#58a700; --bad-bg:#ffdfe0; --bad-text:#ea2b2b;
  --dis:#e5e5e5; --dis-text:#afafaf; --bar:#e5e5e5; --ghost-text:#1cb0f6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131f24; --surface:#1f2c33; --text:#dce6ea; --muted:#8aa0a8; --line:#37464f;
    --ok-bg:#1f2c33; --ok-text:#89e219; --bad-bg:#1f2c33; --bad-text:#ff7878;
    --dis:#37464f; --dis-text:#5a6d76; --bar:#37464f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131f24; --surface:#1f2c33; --text:#dce6ea; --muted:#8aa0a8; --line:#37464f;
  --ok-bg:#1f2c33; --ok-text:#89e219; --bad-bg:#1f2c33; --bad-text:#ff7878;
  --dis:#37464f; --dis-text:#5a6d76; --bar:#37464f;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:700;font-size:17px;line-height:1.4}
button,select,input,textarea{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.logo{font-size:30px;font-weight:900;color:var(--green);letter-spacing:-.01em}
.streak{font-weight:900;color:#ff9600;font-size:19px}
.hright{display:flex;align-items:center;gap:6px}
.hright .icon{font-size:22px}
.pad{padding:8px 20px 28px;display:flex;flex-direction:column;gap:22px}
.lbl{display:block;font-weight:800;color:var(--muted);margin-bottom:8px;font-size:15px}
.select{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-weight:800;font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats div{border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column}
.stats b{font-size:30px;font-weight:900;color:var(--blue);line-height:1.1}
.stats span{color:var(--muted);font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);padding:12px;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.note{margin:10px 0 0;font-size:15px;color:var(--muted);font-weight:600}
.warn{color:var(--bad-text)}
.actions{display:flex;flex-direction:column;gap:12px}

.btn{border:0;border-bottom:4px solid var(--d,#ccc);background:var(--c,#ccc);color:#fff;border-radius:16px;padding:14px 20px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-size:16px;width:100%;transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-top:2px}
.btn.green{--c:var(--green);--d:var(--green-d)}
.btn.blue{--c:var(--blue);--d:var(--blue-d)}
.btn.red{--c:var(--red);--d:var(--red-d)}
.btn.ghost{background:transparent;color:var(--ghost-text);border:2px solid var(--line);border-bottom-width:4px}
.btn.small{width:auto;padding:10px 16px;font-size:14px}
.btn:disabled{background:var(--dis);border-bottom-color:transparent;color:var(--dis-text);cursor:not-allowed}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);font-size:26px;line-height:1;padding:6px 10px;border-radius:12px}
.spk{background:none;border:0;cursor:pointer;color:var(--blue);padding:6px;border-radius:10px;display:inline-flex;vertical-align:middle}

.top{display:flex;align-items:center;gap:14px;padding:18px 20px 8px}
.bar{flex:1;height:16px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease;position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:99px}
.body{flex:1;padding:16px 20px 24px;display:flex;flex-direction:column;gap:20px}
.ask{font-size:26px;font-weight:900;margin:8px 0 0;color:var(--text)}
.kicker{font-size:15px;font-weight:800;color:var(--muted);margin-top:-8px}
.bubble{border:2px solid var(--line);border-radius:18px;padding:18px 20px;font-size:26px;font-weight:800;display:inline-block;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px}
.mic{width:104px;height:104px;border-radius:50%;border:0;border-bottom:6px solid var(--blue-d);background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer}
.mic:active{transform:translateY(3px);border-bottom-width:3px}
.mic.on{background:var(--red);border-bottom-color:var(--red-d);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,75,.45)}100%{box-shadow:0 0 0 26px rgba(255,75,75,0)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}.bar i{transition:none}}
.live{min-height:28px;font-size:20px;text-align:center;color:var(--text);font-weight:800}
.hint{color:var(--muted);text-align:center;font-weight:600;font-size:15px;margin:0}
.input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-weight:700;font-size:17px}
.input:focus{border-color:var(--blue);outline:none}
.field{width:100%;min-height:96px;border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);font-size:22px;font-weight:700;resize:none}
.field:focus{border-color:var(--blue);outline:none}
.acc{display:flex;flex-wrap:wrap;gap:8px}
.acc button{min-width:42px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);padding:6px 10px;font-weight:800;font-size:18px;cursor:pointer}
.said{color:var(--muted);font-size:16px;font-weight:600}

.dock{position:fixed;left:0;right:0;bottom:var(--kb,0px);width:100%;max-width:640px;margin:0 auto;z-index:5;background:var(--bg);
  padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px;
  transition:bottom .28s cubic-bezier(.2,.8,.2,1),background-color .15s}
html.kb .dock{padding-bottom:16px}
@media (prefers-reduced-motion: reduce){.dock{transition:none}}
.dock.ok{background:var(--ok-bg);border-top-color:transparent}
.dock.bad{background:var(--bad-bg);border-top-color:transparent}
.dock .msg{display:flex;flex-direction:column;gap:2px}
.dock .t{font-size:22px;font-weight:900}
.dock.ok .t{color:var(--ok-text)}
.dock.bad .t{color:var(--bad-text)}
.dock .a{font-size:18px;font-weight:800}
.dock.ok .a{color:var(--ok-text)}
.dock.bad .a{color:var(--bad-text)}
.dock .sub{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;cursor:pointer;font-weight:800;text-decoration:underline;color:inherit}

textarea.paste{width:100%;min-height:240px;border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);font-size:17px;font-weight:600;resize:vertical}
textarea.paste:focus{border-color:var(--blue);outline:none}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--green)}
.file{font-size:15px;font-weight:600}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.row .w{flex:1;min-width:0;overflow-wrap:anywhere}
.row .w small{display:block;color:var(--muted);font-weight:600;font-size:15px}
.pips{color:var(--green);letter-spacing:2px;font-size:13px;white-space:nowrap}
.done-h{font-size:32px;font-weight:900;color:var(--gold);margin:12px 0 0;text-align:center}
.big{display:flex;justify-content:center;gap:16px}
.big div{border:2px solid var(--line);border-radius:16px;padding:14px 22px;text-align:center}
.big b{display:block;font-size:30px;font-weight:900;color:var(--blue)}
.big span{color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90%;text-align:center;z-index:9}
</style>

<body>
<div id="app"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const LANGS=[
  {code:'it-IT',name:'Італійська',adv:'італійською'},
  {code:'en-US',name:'Англійська',adv:'англійською'},
  {code:'fr-FR',name:'Французька',adv:'французькою'},
  {code:'de-DE',name:'Німецька',adv:'німецькою'},
  {code:'es-ES',name:'Іспанська',adv:'іспанською'},
  {code:'pt-PT',name:'Португальська',adv:'португальською'},
  {code:'pl-PL',name:'Польська',adv:'польською'}
];
const ART={
  it:/^(?:(?:il|lo|la|i|gli|le|un|uno|una)\s+|l'|un')/,
  fr:/^(?:(?:le|la|les|un|une|des)\s+|l')/,
  es:/^(?:(?:el|la|los|las|un|una)\s+)/,
  de:/^(?:(?:der|die|das|ein|eine)\s+)/,
  en:/^(?:(?:the|a|an|to)\s+)/,
  pt:/^(?:(?:o|a|os|as|um|uma)\s+)/
};
const ACC={it:'àèéìòù',fr:'àâçéèêëîïôùûü',es:'áéíóúñü',de:'äöüß',pl:'ąćęłńóśźż',pt:'áàâãçéêíóôõú'};
const KEY='slova_trainer_v1';
const ROUND=10;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* ---------- storage ---------- */
const blank=()=>({lang:'it-IT',mode:'speak',theme:'auto',sound:true,conjTense:'pres',words:{},tomb:{},streak:{last:'',n:0}});
let store=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r){return Object.assign(blank(),JSON.parse(r));}}catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
const cur=()=>{if(!store.words[store.lang])store.words[store.lang]=[];return store.words[store.lang];};
const langInfo=()=>LANGS.find(l=>l.code===store.lang)||LANGS[0];
const short=()=>store.lang.slice(0,2);

/* ---------- theme ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(store.theme==='dark'||store.theme==='light')r.setAttribute('data-theme',store.theme);else r.removeAttribute('data-theme');
}
const isDark=()=>store.theme==='dark'||(store.theme!=='light'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);

/* ---------- sounds (synthesized, no audio files) ---------- */
let actx=null;
function audio(){
  try{
    if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}
    if(actx&&actx.state==='suspended')actx.resume();
  }catch(e){}
  return actx;
}
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{audio();},{passive:true}));
function playSound(kind){
  if(store.sound===false)return;
  const ctx=audio();if(!ctx)return;
  try{
    const now=ctx.currentTime+0.02;
    const note=(f,t,d,type,g,lp)=>{
      const o=ctx.createOscillator(),gn=ctx.createGain();
      o.type=type;o.frequency.setValueAtTime(f,now+t);
      gn.gain.setValueAtTime(0.0001,now+t);
      gn.gain.exponentialRampToValueAtTime(g,now+t+0.015);
      gn.gain.exponentialRampToValueAtTime(0.0001,now+t+d);
      if(lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(gn);}else o.connect(gn);
      gn.connect(ctx.destination);o.start(now+t);o.stop(now+t+d+0.05);
    };
    if(kind==='ok'){
      note(784,0,.16,'sine',.22);note(1568,0,.16,'sine',.05);
      note(1175,.09,.42,'sine',.24);note(2350,.09,.3,'sine',.05);
    }else if(kind==='bad'){
      note(247,0,.2,'triangle',.28,900);note(185,.17,.34,'triangle',.28,700);
    }else if(kind==='done'){
      [523,659,784,1047].forEach((f,i)=>note(f,i*.11,.4,'sine',.2));
      note(1047,.44,.6,'sine',.2);note(1319,.44,.6,'sine',.1);
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const ICON_MIC='<svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
const ICON_SPK='<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
let toastT=null;
function toast(msg){
  let t=$('.toast');if(t)t.remove();
  t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),4200);
}
function say(text){
  try{
    const clean=String(text).split('/')[0].replace(/\([^)]*\)/g,'').trim();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean);u.lang=store.lang;u.rate=.9;speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- answer matching ---------- */
function normText(s,acc){
  let x=String(s).normalize('NFC').toLowerCase().replace(/[’‘`´ʼ]/g,"'");
  if(!acc)x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  x=x.replace(/[^\p{L}\p{N}' ]/gu,' ').replace(/\s+/g,' ').trim();
  return x;
}
const compact=s=>s.replace(/[' ]/g,'');
function variants(tl){
  const out=new Set();
  for(const part of tl.split('/')){
    const p=part.trim();if(!p)continue;
    out.add(p);out.add(p.replace(/\([^)]*\)/g,' '));out.add(p.replace(/[()]/g,''));
  }
  return out;
}
function keySet(tl,acc){
  const keys=new Set(),art=ART[short()];
  for(const v of variants(tl)){
    const n=normText(v,acc);if(!n)continue;
    keys.add(compact(n));
    if(art){const s=n.replace(art,'');if(s&&s!==n)keys.add(compact(s));}
  }
  return keys;
}
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function near(k,set,minLen){
  for(const c of set){if(Math.min(k.length,c.length)>=minLen&&lev(k,c)<=1)return true;}
  return false;
}
function judgeSpeech(alts,tl){
  const keys=keySet(tl,false);let close=false;
  for(const a of alts){
    const k=compact(normText(a,false));if(!k)continue;
    if(keys.has(k))return{kind:'ok'};
    if(near(k,keys,6))close=true;
  }
  return close?{kind:'ok',note:'Майже ідеально — перевірте вимову.'}:{kind:'bad'};
}
function judgeType(input,tl){
  const strict=compact(normText(input,true));
  if(keySet(tl,true).has(strict))return{kind:'ok'};
  const loose=compact(normText(input,false));
  const lk=keySet(tl,false);
  if(lk.has(loose))return{kind:'bad',note:'Майже! Перевірте діакритику (наголоси, апострофи).'};
  if(near(loose,lk,4))return{kind:'bad',note:'Майже! Є одруківка.'};
  return{kind:'bad'};
}

/* ---------- import parsing ---------- */
const CYR=/[\u0400-\u04FF]/;
const SEPS=[/\t/,/\s*;\s*/,/\s+[-–—]\s+/,/\s*=\s*/,/\s*\|\s*/,/\s*,\s*/];
function parsePairs(text,foreignFirst){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim().replace(/^\d+\s*[.)]\s+/,'');if(!line)continue;
    for(const sep of SEPS){
      const m=line.match(sep);
      if(m){
        let a=line.slice(0,m.index).trim(),b=line.slice(m.index+m[0].length).trim();
        a=a.replace(/^["']|["']$/g,'');b=b.replace(/^["']|["']$/g,'');
        if(a&&b){
          const ca=CYR.test(a),cb=CYR.test(b);
          if(ca&&!cb)out.push({uk:a,tl:b});
          else if(cb&&!ca)out.push({uk:b,tl:a});
          else out.push(foreignFirst?{uk:b,tl:a}:{uk:a,tl:b});
        }
        break;
      }
    }
  }
  return out;
}

/* ---------- PDF import ---------- */
const PDFJS_BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLoad=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(!pdfLoad)pdfLoad=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=PDFJS_BASE+'pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js';res();};
    s.onerror=()=>{pdfLoad=null;rej(new Error('pdfjs'));};
    document.head.appendChild(s);
  });
  return pdfLoad;
}
async function pdfToText(file){
  await loadPdfJs();
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await(await pdf.getPage(p)).getTextContent();
    const rows=[];
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      const x=it.transform[4],y=it.transform[5];
      let row=rows.find(r=>Math.abs(r.y-y)<3);
      if(!row){row={y,items:[]};rows.push(row);}
      row.items.push({x,w:it.width,s:it.str.trim()});
    }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){
      r.items.sort((a,b)=>a.x-b.x);
      let line='',end=null;
      for(const it of r.items){
        if(end!==null){const gap=it.x-end;line+=gap>12?'\t':(gap>1?' ':'');}
        line+=it.s;end=it.x+it.w;
      }
      lines.push(line);
    }
  }
  return lines.join('\n');
}

/* ---------- cloud sync (Firebase: Auth + Firestore) ---------- */
const CLOUD_KEY='slova_cloud_fb1';
// Якщо вписати сюди apiKey і projectId з Firebase, вводити їх на кожному пристрої не потрібно.
const BUILT_IN={apiKey:'',projectId:''};
const FB_BASE='https://www.gstatic.com/firebasejs/10.14.1/';
let cloud={};
try{cloud=JSON.parse(localStorage.getItem(CLOUD_KEY))||{};}catch(e){cloud={};}
const saveCloud=()=>{try{localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud));}catch(e){}};
const cfg=()=>({apiKey:String(BUILT_IN.apiKey||cloud.apiKey||'').trim(),projectId:String(BUILT_IN.projectId||cloud.projectId||'').trim()});
const configured=()=>{const c=cfg();return !!(c.apiKey&&c.projectId);};

const wkey=w=>(w.uk||'').trim().toLowerCase()+'|'+(w.tl||'').trim().toLowerCase();
function tombstone(w){if(!store.tomb)store.tomb={};store.tomb[store.lang+'|'+wkey(w)]=Date.now();}

  'auth/missing-password':'Введіть пароль.',

  'unavailable':'Немає зв’язку з Firestore.',
  'not-found':'У проєкті не створена база Firestore (Build → Firestore Database → Create database).'
};
function friendly(e){
  const code=e&&e.code,m=String((e&&e.message)||e);
  if(code&&ERR[code])return ERR[code];
  if(m==='nosession')return 'Сесія завершилась. Увійдіть ще раз.';
  if(/Failed to fetch|Failed to load/i.test(m))return 'Не вдалося завантажити Firebase. Перевірте інтернет.';
  if(/API key not valid/i.test(m))return 'Неправильний apiKey.';
  return m;
}
let fbReady=null;
function loadScript(src){return new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('Failed to load '+src));document.head.appendChild(t);});}
function initFirebase(){
  if(fbReady)return fbReady;
  fbReady=(async()=>{
    if(!window.firebase){
      await loadScript(FB_BASE+'firebase-app-compat.js');
      await loadScript(FB_BASE+'firebase-auth-compat.js');
      await loadScript(FB_BASE+'firebase-firestore-compat.js');
    }
    const c=cfg();
    if(!window.firebase.apps.length)window.firebase.initializeApp({apiKey:c.apiKey,projectId:c.projectId,authDomain:c.projectId+'.firebaseapp.com'});
    return window.firebase;
  })().catch(e=>{fbReady=null;throw e;});
  return fbReady;
}
async function currentUser(){
  const fb=await initFirebase(),auth=fb.auth();
  return new Promise(res=>{const un=auth.onAuthStateChanged(u=>{un();res(u);});});
}
function parseConfig(text){
  const g=k=>{const m=String(text).match(new RegExp(k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));return m?m[1].trim():'';};
  return{apiKey:g('apiKey'),projectId:g('projectId')};
}
function mergeRemote(rm){
  const tomb=Object.assign({},rm.tomb||{});
  for(const k of Object.keys(store.tomb||{}))tomb[k]=Math.max(tomb[k]||0,store.tomb[k]);
  const langs=new Set([...Object.keys(store.words),...Object.keys(rm.words||{})]);
  const out={};
  for(const lg of langs){
    const map=new Map();
    for(const w of (store.words[lg]||[]))map.set(wkey(w),w);
    for(const w of ((rm.words||{})[lg]||[])){
      const k=wkey(w),l=map.get(k);
      if(!l){map.set(k,Object.assign({},w,{id:w.id||Date.now().toString(36)+Math.random().toString(36).slice(2,7)}));}
      else{
        if((w.last||0)>(l.last||0)){l.lvl=w.lvl;l.ok=w.ok;l.bad=w.bad;l.last=w.last;}
        l.t0=Math.max(l.t0||0,w.t0||0);
      }
    }
    out[lg]=[...map.values()].filter(w=>{const t=tomb[lg+'|'+wkey(w)];return !t||(w.t0||0)>t;});
  }
  store.words=out;store.tomb=tomb;
  const a=store.streak||{last:'',n:0},b=rm.streak||{last:'',n:0};
  if((b.last||'')>(a.last||'')||((b.last||'')===(a.last||'')&&(b.n||0)>(a.n||0)))store.streak={last:b.last||'',n:b.n||0};
  save();
}
function statusText(){
  if(cloud.err)return 'Помилка синхронізації: '+cloud.err;
  if(cloud.last)return 'Синхронізовано о '+new Date(cloud.last).toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit'});
  return '';
}
function paintStatus(t){const el=$('#cstat');if(el)el.textContent=t;}
let syncing=false,syncTimer=null;
function scheduleSync(){if(!loggedIn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500);}
async function syncNow(){
  if(!loggedIn()||syncing||view==='lesson')return;
  syncing=true;paintStatus('Синхронізація…');
  try{
    const u=await currentUser();
    if(!u){cloud.email='';saveCloud();throw new Error('nosession');}
    const ref=window.firebase.firestore().collection('users').doc(u.uid);
    const snap=await ref.get();
    const d=snap.exists?snap.data():null;
    if(d&&d.data){let remote=null;try{remote=JSON.parse(d.data);}catch(e){}if(remote)mergeRemote(remote);}
    await ref.set({data:JSON.stringify({words:store.words,tomb:store.tomb||{},streak:store.streak}),updatedAt:new Date().toISOString()});
    cloud.last=Date.now();cloud.err='';saveCloud();
    if(view==='home'||view==='list')render();else paintStatus(statusText());
  }catch(e){
    cloud.err=friendly(e);saveCloud();
    if(view==='home')render();else paintStatus(statusText());
  }finally{syncing=false;}
}
async function doAuth(kind){
  const email=($('#em').value||'').trim(),pw=$('#pw').value||'',msg=$('#smsg');
  if(!email||!pw){msg.textContent='Введіть email і пароль.';return;}
  msg.textContent='Зачекайте…';
  try{
    const fb=await initFirebase(),a=fb.auth();
    const cred=kind==='up'?await a.createUserWithEmailAndPassword(email,pw):await a.signInWithEmailAndPassword(email,pw);
    cloud.email=(cred.user&&cred.user.email)||email;cloud.err='';saveCloud();
    await syncNow();
    if(cloud.err){renderSync();return;}
    toast('Синхронізацію увімкнено');go('home');
  }catch(e){msg.textContent=friendly(e);}
}

    <button class="btn green" id="csave">Зберегти</button>`;
  }else if(!loggedIn()){

    <button class="linkbtn" id="cforgot" style="align-self:flex-start;color:var(--muted)">Забули пароль?</button>
    <button class="linkbtn" id="creset" style="align-self:flex-start;color:var(--muted)">Змінити налаштування Firebase</button>`;
  }else{
    body=`<p class="note">Ви увійшли як <b>${esc(cloud.email||'')}</b>.</p>
    <p class="note" id="cstat">${esc(statusText())}</p>
    <p class="note">Після виходу слова на цьому пристрої очищаються. У хмарі вони залишаються, і з’являться знову після входу.</p>
    <p class="note warn" id="smsg" role="status">${cloud.err?esc(cloud.err):''}</p>
    <button class="btn green" id="cnow">Синхронізувати зараз</button>
    <button class="btn ghost" id="cout">Вийти з акаунта</button>`;
  }
  app.innerHTML=`<div class="top"><button class="icon" id="back" aria-label="Назад">←</button><div style="flex:1;font-weight:900;font-size:20px">Синхронізація</div></div><main class="pad">${body}</main>`;
  const g=id=>$(id);
  g('#back').onclick=()=>go('home');
  if(g('#csave'))g('#csave').onclick=()=>{
    const c=parseConfig(g('#cfgtxt').value);
    if(!c.apiKey||!c.projectId){g('#smsg').textContent='Не знайшов apiKey і projectId. Вставте блок firebaseConfig повністю.';return;}
    cloud.apiKey=c.apiKey;cloud.projectId=c.projectId;saveCloud();renderSync();
  };
  if(g('#cin'))g('#cin').onclick=()=>doAuth('in');
  if(g('#cup'))g('#cup').onclick=()=>doAuth('up');
  if(g('#cforgot'))g('#cforgot').onclick=async()=>{
    const email=(g('#em').value||'').trim(),msg=g('#smsg');
    if(!email){msg.textContent='Введіть email вище, і ми надішлемо лист для відновлення пароля.';return;}
    msg.textContent='Зачекайте…';
    try{const fb=await initFirebase();await fb.auth().sendPasswordResetEmail(email);msg.textContent='Якщо такий акаунт є, лист для відновлення пароля надіслано на '+email+'. Перевірте також «Спам».';}
    catch(e){msg.textContent=friendly(e);}
  };
  if(g('#creset'))g('#creset').onclick=()=>{cloud.apiKey='';cloud.projectId='';saveCloud();location.reload();};
  if(g('#cnow'))g('#cnow').onclick=async()=>{await syncNow();renderSync();};
  if(g('#cout'))g('#cout').onclick=async()=>{
    g('#smsg').textContent='Зберігаю слова в хмарі…';
    await syncNow();
    if(cloud.err){g('#smsg').textContent='Вихід скасовано, щоб не втратити слова. Причина: '+cloud.err;return;}
    try{const fb=await initFirebase();await fb.auth().signOut();}catch(e){}
    store.words={};store.tomb={};store.streak={last:'',n:0};save();
    cloud.email='';cloud.err='';cloud.last=0;saveCloud();renderSync();
  };
}

function renderImport(){
  const lang=langInfo();
  app.innerHTML=`
  <div class="top"><button class="icon" id="back" aria-label="Назад">←</button><div style="flex:1;font-weight:900;font-size:20px">Додати слова</div></div>
  <main class="pad">
    <section>
      <label class="lbl" for="paste">Вставте список: одне слово на рядок, українське й ${esc(lang.adv.replace(/ою$/,'а'))} слово через «;», Tab або « - »</label>
      <textarea id="paste" class="paste" spellcheck="false" placeholder="привіт ; ciao&#10;дякую ; grazie&#10;будинок ; la casa"></textarea>
    </section>
    <label class="check"><input type="checkbox" id="flip" ${importFlip?'checked':''}> Якщо мову не вдалось визначити, іноземне слово йде першим</label>
    <div class="file"><label class="lbl" for="file">Або завантажте файл .pdf, .txt чи .csv</label><input type="file" id="file" accept=".pdf,.txt,.csv,.tsv,application/pdf,text/plain,text/csv"></div>
    <p class="note" id="count"></p>
    <button class="btn green" id="do" disabled>Додати</button>
  </main>`;
  const ta=$('#paste');
  const upd=()=>{
    importFlip=$('#flip').checked;
    const n=parsePairs(ta.value,importFlip).length;
    $('#count').textContent=n?`Розпізнано пар: ${n}. Вони додадуться до мови «${lang.name}».`:'Ще нічого не розпізнано.';
    $('#do').disabled=!n;$('#do').textContent=n?`Додати ${n}`:'Додати';
  };
  ta.oninput=upd;$('#flip').onchange=upd;
  $('#file').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const put=t=>{ta.value=(ta.value?ta.value+'\n':'')+t;upd();};
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
      $('#count').textContent='Читаю PDF…';
      pdfToText(f).then(t=>{
        if(!t.trim()){toast('У цьому PDF немає тексту (схоже, це скан). Спробуйте PDF із виділюваним текстом.');upd();return;}
        put(t);toast('PDF прочитано. Перевірте список нижче й натисніть «Додати».');
      }).catch(()=>{toast('Не вдалося прочитати PDF. Скопіюйте текст із нього й вставте вручну.');upd();});
    }else{
      const r=new FileReader();r.onload=()=>put(r.result);r.readAsText(f);
    }
  };
  $('#back').onclick=()=>go('home');
  $('#do').onclick=()=>{
    const pairs=parsePairs(ta.value,importFlip),ws=cur();
    let added=0;
    for(const p of pairs){
      if(ws.some(w=>w.uk.toLowerCase()===p.uk.toLowerCase()&&w.tl.toLowerCase()===p.tl.toLowerCase()))continue;
      ws.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),uk:p.uk,tl:p.tl,lvl:0,ok:0,bad:0,last:0,t0:Date.now()});added++;
    }
    save();scheduleSync();go('home');
    toast(added?`Додано слів: ${added}`+(added<pairs.length?` (дублікати пропущено: ${pairs.length-added})`:''):'Усі ці слова вже є у списку.');
  };
  upd();
}

  stare:{pres:['sto','stai','sta','stiamo','state','stanno'],fut:'star',part:'stato'},
  sapere:{pres:['so','sai','sa','sappiamo','sapete','sanno'],fut:'sapr',part:'saputo'},
  potere:{pres:['posso','puoi','può','possiamo','potete','possono'],fut:'potr',part:'potuto'},
  dovere:{pres:['devo','devi','deve','dobbiamo','dovete','devono'],fut:'dovr',part:'dovuto'},
  volere:{pres:['voglio','vuoi','vuole','vogliamo','volete','vogliono'],fut:'vorr',part:'voluto'},
  venire:{pres:['vengo','vieni','viene','veniamo','venite','vengono'],fut:'verr',part:'venuto'},
  tenere:{pres:['tengo','tieni','tiene','teniamo','tenete','tengono'],fut:'terr',part:'tenuto'},
  rimanere:{pres:['rimango','rimani','rimane','rimaniamo','rimanete','rimangono'],fut:'rimarr',part:'rimasto'},
  uscire:{pres:['esco','esci','esce','usciamo','uscite','escono'],part:'uscito'},
  riuscire:{pres:['riesco','riesci','riesce','riusciamo','riuscite','riescono'],part:'riuscito'},
  bere:{pres:['bevo','bevi','beve','beviamo','bevete','bevono'],fut:'berr',part:'bevuto'},
  porre:{pres:['pongo','poni','pone','poniamo','ponete','pongono'],fut:'porr',part:'posto'},
  trarre:{pres:['traggo','trai','trae','traiamo','traete','traggono'],fut:'trarr',part:'tratto'},
  salire:{pres:['salgo','sali','sale','saliamo','salite','salgono'],part:'salito'},
  scegliere:{pres:['scelgo','scegli','sceglie','scegliamo','scegliete','scelgono'],part:'scelto'},
  sedere:{pres:['siedo','siedi','siede','sediamo','sedete','siedono'],part:'seduto'},
  spegnere:{pres:['spengo','spegni','spegne','spegniamo','spegnete','spengono'],part:'spento'},
  piacere:{pres:['piaccio','piaci','piace','piacciamo','piacete','piacciono'],part:'piaciuto'},
  morire:{pres:['muoio','muori','muore','moriamo','morite','muoiono'],part:'morto'},
  cuocere:{pres:['cuocio','cuoci','cuoce','cuociamo','cuocete','cuociono'],part:'cotto'},
  tradurre:{pres:['traduco','traduci','traduce','traduciamo','traducete','traducono'],fut:'tradurr',part:'tradotto'},
  condurre:{pres:['conduco','conduci','conduce','conduciamo','conducete','conducono'],fut:'condurr',part:'condotto'},
  produrre:{pres:['produco','produci','produce','produciamo','producete','producono'],fut:'produrr',part:'prodotto'},
  vivere:{fut:'vivr',part:'vissuto'},
  vedere:{fut:'vedr',part:'visto'},
  cadere:{fut:'cadr'},
  chiudere:{part:'chiuso'},prendere:{part:'preso'},mettere:{part:'messo'},chiedere:{part:'chiesto'},
  rispondere:{part:'risposto'},scrivere:{part:'scritto'},leggere:{part:'letto'},nascere:{part:'nato'},
  correre:{part:'corso'},decidere:{part:'deciso'},conoscere:{part:'conosciuto'},crescere:{part:'cresciuto'},
  perdere:{part:'perso'},vincere:{part:'vinto'},dividere:{part:'diviso'},nascondere:{part:'nascosto'},
  rompere:{part:'rotto'},scendere:{part:'sceso'},succedere:{part:'successo'},
  parere:{pres:['paio','pari','pare','paiamo','parete','paiono'],fut:'parr',part:'parso'},
  apparire:{pres:['appaio','appari','appare','appariamo','apparite','appaiono'],part:'apparso'},
  scomparire:{pres:['scompaio','scompari','scompare','scompariamo','scomparite','scompaiono'],part:'scomparso'}
};
function isVerbInf(tl){
  const s=(tl||'').split('/')[0].trim().toLowerCase();
  return /^[a-zàèéìòù]+(are|ere|ire|arsi|ersi|irsi)$/.test(s);
}
function verbList(){return cur().filter(w=>isVerbInf(w.tl));}
function splitVerb(tl){
  const s=(tl||'').split('/')[0].trim().toLowerCase();
  const refl=/(ar|er|ir)si$/.test(s);
  return{core:refl?s.slice(0,-2)+'e':s,refl};
}
function stemEnd(core){return{stem:core.slice(0,-3),end:core.slice(-3)};}
function orthoAdjust(stem,ending,end){
  if(end!=='are'||!/^[ei]/.test(ending))return stem+ending;
  if(/ci$|gi$/.test(stem))return stem.slice(0,-1)+ending;
  if(/c$|g$/.test(stem))return stem+'h'+ending;
  return stem+ending;
}
function presenteRegular(core){
  const{stem,end}=stemEnd(core);
  if(end==='ire'&&ISC.has(core))return PRES_END_ISC.map(e=>stem+e);
  return PRES_END[end].map(e=>orthoAdjust(stem,e,end));
}
function futuroStem(core){
  const{stem,end}=stemEnd(core);
  if(end==='ire')return stem+'ir';
  if(/ci$|gi$/.test(stem))return stem.slice(0,-1)+'er';
  if(/c$|g$/.test(stem))return stem+'her';
  return stem+'er';
}
function presenteForms(core){const irr=IRR[core];return(irr&&irr.pres)?irr.pres.slice():presenteRegular(core);}
function futuroForms(core){const irr=IRR[core];const stem=(irr&&irr.fut)?irr.fut:futuroStem(core);return FUT_END.map(e=>stem+e);}
function participio(core){
  const irr=IRR[core];if(irr&&irr.part)return irr.part;
  const{stem,end}=stemEnd(core);
  return stem+(end==='are'?'ato':end==='ere'?'uto':'ito');
}
function passatoForms(core,forceEssere){
  const useEssere=forceEssere||AUX_ESSERE.has(core),p=participio(core),aux=useEssere?ESSERE:AVERE;
  return aux.map((a,i)=>{
    if(!useEssere)return a+' '+p;
    const pm=p,pf=p.replace(/o$/,'a'),pmpl=p.replace(/o$/,'i'),pfpl=p.replace(/o$/,'e');
    return i<3?(a+' '+pm+' / '+a+' '+pf):(a+' '+pmpl+' / '+a+' '+pfpl);
  });
}
function conjugate(tl,tense){
  const{core,refl}=splitVerb(tl);
  let forms=tense==='pres'?presenteForms(core):tense==='fut'?futuroForms(core):passatoForms(core,refl);
  if(refl){const PRON=['mi','ti','si','ci','vi','si'];forms=forms.map((f,i)=>f.split('/').map(s=>PRON[i]+' '+s.trim()).join(' / '));}
  return forms;
}
function renderConjSetup(){
  const verbs=verbList();
  app.innerHTML=`
  <div class="top"><button class="icon" id="back" aria-label="Назад">←</button><div style="flex:1;font-weight:900;font-size:20px">Дієвідмінювання</div></div>
  <main class="pad">
    <p class="note">${verbs.length?`Дієслів у списку: <b>${verbs.length}</b>.`:'У списку слів поки немає дієслів. Додайте слово, де переклад закінчується на -are, -ere або -ire, наприклад «бачити — vedere».'}</p>
    <section><div class="lbl">Час</div><div class="seg">${TENSES.map(t=>`<button data-t="${t.id}" aria-pressed="${(store.conjTense||'pres')===t.id}">${t.label}</button>`).join('')}</div></section>
    <p class="note">Правопис перевіряється так само, як і для звичайних слів: наголоси необов'язкові, а невеличка одруківка не завадить.</p>
    <button class="btn green" id="start" ${verbs.length?'':'disabled'}>Почати</button>
  </main>`;
  $('#back').onclick=()=>go('home');
  $$('[data-t]').forEach(b=>b.onclick=()=>{store.conjTense=b.dataset.t;save();renderConjSetup();});
  $('#start').onclick=startConj;
}
function startConj(){
  const verbs=verbList();if(!verbs.length)return;
  const tense=store.conjTense||'pres',pool=['pres','fut','pp'];
  const items=[];
  for(const v of verbs)for(let p=0;p<6;p++)items.push({vid:v.id,p,t:tense==='mix'?pool[Math.floor(Math.random()*3)]:tense});
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  L={kind:'conj',queue:items.slice(0,Math.min(ROUND,items.length)),i:0,solved:0,firstOk:0,mist:[],retry:new Set(),stage:'ask',res:null,forceType:false};
  L.total=L.queue.length;
  go('lesson');
}

/* ---------- lesson ---------- */
function startLesson(){
  const ws=cur();if(!ws.length)return;
  const now=Date.now();
  const picked=ws.map(w=>({w,s:(w.lvl||0)+Math.random()*1.6+((now-(w.last||0))<600000?2:0)}))
    .sort((a,b)=>a.s-b.s).slice(0,Math.min(ROUND,ws.length)).map(x=>x.w.id);
  for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]];}
  L={queue:picked,i:0,total:picked.length,solved:0,firstOk:0,mist:[],retry:new Set(),stage:'ask',res:null,forceType:false,heard:[],interim:''};
  go('lesson');
}
function curItem(){
  if((L.kind||'vocab')!=='conj'){
    const w=cur().find(x=>x.id===L.queue[L.i]);
    return{uk:w.uk,tl:w.tl,kicker:null,key:w.id,w};
  }
  const it=L.queue[L.i],v=cur().find(x=>x.id===it.vid);
  if(!v)return{uk:'?',tl:'?',kicker:null,key:it.vid+'|'+it.p+'|'+it.t,w:null};
  const forms=conjugate(v.tl,it.t);
  return{uk:PRON_LABEL[it.p],tl:forms[it.p],kicker:v.tl.split('/')[0].trim()+' · '+TENSE_LABEL[it.t],key:v.id+'|'+it.p+'|'+it.t,w:null};
}
const speakMode=()=>store.mode==='speak'&&!!SR&&!L.forceType;

function renderLesson(){
  const item=curItem(),lang=langInfo(),sp=speakMode(),pct=Math.round(L.solved/L.total*100),conj=(L.kind==='conj');
  let mid='',dock='';
  if(L.stage==='ask'){
    if(sp){
      mid=`<div class="mic-zone">
        <button class="mic" id="mic" aria-label="Говорити" aria-pressed="false">${ICON_MIC}</button>
        <div class="live" id="live" aria-live="polite"></div>
        <p class="hint" id="mh">Натисніть на мікрофон (або пробіл) і скажіть слово.</p>
      </div>`;
      dock=`<button class="btn ghost" id="cant">Не можу говорити зараз</button>`;
    }else{
      const acc=ACC[short()]||'';
      mid=`<textarea id="inp" class="field" rows="2" lang="${store.lang}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${conj?'Введіть форму дієслова':'Введіть переклад'}"></textarea>
        ${acc?`<div class="acc" aria-label="Спеціальні символи">${acc.split('').map(c=>`<button type="button" data-ch="${c}">${c}</button>`).join('')}</div>`:''}`;
      dock=`<button class="btn green" id="primary" disabled>Перевірити</button>`;
    }
  }else{
    const ok=L.res.kind==='ok';
    mid=(L.res.said?`<div class="said">Ви ${sp||L.res.viaSpeech?'сказали':'написали'}: «${esc(L.res.said)}»</div>`:'');
    dock=`<div class="msg">
        <div class="t">${ok?'Правильно!':'Правильна відповідь:'}</div>
        <div class="a">${ok?(L.res.note?esc(L.res.note)+' ':'')+'Еталон: ':''}${esc(item.tl.split('/').map(s=>s.trim()).join(' / '))} <button class="spk" id="hear" aria-label="Прослухати" style="color:inherit">${ICON_SPK}</button></div>
        ${!ok&&L.res.note?`<div class="a">${esc(L.res.note)}</div>`:''}
      </div>
      ${!ok?`<div class="sub">${L.res.viaSpeech?'<button class="linkbtn" id="again">Спробувати ще раз</button>':''}<button class="linkbtn" id="force">Зарахувати як правильно</button></div>`:''}
      <button class="btn ${ok?'green':'red'}" id="primary">Продовжити</button>`;
  }
  const cls=L.stage==='result'?(L.res.kind==='ok'?'ok':'bad'):'';
  app.innerHTML=`
  <div class="top"><button class="icon" id="quit" aria-label="Вийти з уроку">✕</button>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>
  <main class="body">
    <h1 class="ask">${conj?(sp?'Скажіть':'Напишіть')+' форму дієслова':(sp?'Скажіть':'Напишіть')+' '+lang.adv}</h1>
    ${item.kicker?`<div class="kicker">${esc(item.kicker)}</div>`:''}
    <div class="bubble">${esc(item.uk)}</div>
    ${mid}
  </main>
  <footer class="dock ${cls}">${dock}</footer>`;
  const dk=$('.dock');if(dk)app.style.paddingBottom=dk.offsetHeight+'px';
  $('#quit').onclick=()=>{go('home');};
  if(L.stage==='ask'){
    if(sp){
      $('#mic').onclick=toggleMic;
      $('#cant').onclick=()=>{L.forceType=true;renderLesson();};
    }else{
      const inp=$('#inp'),btn=$('#primary');
      inp.oninput=()=>{btn.disabled=!inp.value.trim();};
      $$('[data-ch]').forEach(b=>b.onclick=()=>{
        const s=inp.selectionStart,e=inp.selectionEnd;inp.value=inp.value.slice(0,s)+b.dataset.ch+inp.value.slice(e);
        inp.focus();inp.selectionStart=inp.selectionEnd=s+1;btn.disabled=!inp.value.trim();
      });
      btn.onclick=()=>{
        const v=inp.value.trim();if(!v)return;
        const r=judgeType(v,item.tl);r.said=v;r.viaSpeech=false;finishAnswer(r);
      };
      inp.focus();
    }
  }else{
    $('#hear').onclick=()=>say(item.tl);
    $('#primary').onclick=commit;
    const ag=$('#again');if(ag)ag.onclick=()=>{L.stage='ask';L.res=null;renderLesson();};
    const fo=$('#force');if(fo)fo.onclick=()=>{L.res={kind:'ok',said:L.res.said,viaSpeech:L.res.viaSpeech};playSound('ok');renderLesson();};
    if(L.res.kind!=='ok'){
      const key0=item.key;
      setTimeout(()=>{if(view==='lesson'&&L&&L.stage==='result'&&L.res&&L.res.kind!=='ok'&&curItem().key===key0)say(item.tl);},750);
    }
  }
}
function finishAnswer(r){L.res=r;L.stage='result';playSound(r.kind==='ok'?'ok':'bad');renderLesson();}

function commit(){
  const item=curItem(),first=!L.retry.has(item.key),ok=L.res.kind==='ok';
  if(ok){
    L.solved++;
    if(first)L.firstOk++;
  }else{
    if(first)L.mist.push(item);
    L.retry.add(item.key);L.queue.push(L.queue[L.i]);
  }
  if((L.kind||'vocab')!=='conj'&&item.w){
    const w=item.w;
    if(ok&&first){w.lvl=Math.min(5,(w.lvl||0)+1);w.ok=(w.ok||0)+1;}
    if(!ok&&first){w.lvl=Math.max(0,(w.lvl||0)-1);w.bad=(w.bad||0)+1;}
    w.last=Date.now();save();
  }
  L.i++;L.stage='ask';L.res=null;L.forceType=false;
  if(L.i>=L.queue.length)finishLesson();else renderLesson();
}
function finishLesson(){
  const today=new Date().toLocaleDateString('sv'),y=new Date(Date.now()-864e5).toLocaleDateString('sv');
  if(store.streak.last!==today){store.streak.n=(store.streak.last===y?(store.streak.n||0):0)+1;store.streak.last=today;save();}
  go('done');playSound('done');if((L.kind||'vocab')!=='conj')scheduleSync();
}
function renderDone(){
  const acc=Math.round(L.firstOk/L.total*100),conj=(L.kind==='conj'),mist=L.mist;
  app.innerHTML=`
  <main class="pad" style="padding-top:28px">
    <h1 class="done-h">Урок завершено!</h1>
    <div class="big"><div><b>${acc}%</b><span>з першого разу</span></div><div><b>${L.total}</b><span>${conj?'форм':'слів'}</span></div><div><b>🔥 ${store.streak.n||0}</b><span>днів підряд</span></div></div>
    ${mist.length?`<section><div class="lbl">Повторіть це</div><div class="list">${mist.map((it,idx)=>`
      <div class="row"><button class="spk" data-i="${idx}" aria-label="Прослухати">${ICON_SPK}</button><div class="w">${it.kicker?`<small>${esc(it.kicker)}</small>`:''}${esc(it.uk)} → ${esc(it.tl.split('/').map(s=>s.trim()).join(' / '))}</div></div>`).join('')}</div></section>`:'<p class="hint">Жодної помилки — чудова робота.</p>'}
    <div class="actions"><button class="btn green" id="more">${conj?'Ще один раунд':'Ще один урок'}</button><button class="btn ghost" id="home">На головну</button></div>
  </main>`;
  $$('[data-i]').forEach(b=>b.onclick=()=>{const it=mist[+b.dataset.i];if(it)say(it.tl);});
  $('#more').onclick=conj?startConj:startLesson;$('#home').onclick=()=>go('home');
}

/* ---------- speech recognition ---------- */
let rec=null,listening=false,gotFinal=false;
function stopListen(){
  if(rec){try{rec.onresult=rec.onerror=rec.onend=null;rec.abort();}catch(e){}}
  rec=null;listening=false;
}
function setMic(on){
  const m=$('#mic');if(!m)return;
  m.classList.toggle('on',on);m.setAttribute('aria-pressed',String(on));
}
function setLive(t,hint){
  const l=$('#live'),h=$('#mh');
  if(l&&t!==undefined)l.textContent=t;
  if(h&&hint!==undefined)h.textContent=hint;
}
function toggleMic(){
  if(listening){try{rec.stop();}catch(e){}return;}
  if(!SR)return;
  try{speechSynthesis.cancel();}catch(e){}
  rec=new SR();rec.lang=store.lang;rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  gotFinal=false;
  rec.onstart=()=>{listening=true;setMic(true);setLive('…','Слухаю…');};
  rec.onresult=e=>{
    const res=e.results[e.results.length-1];
    setLive(res[0].transcript);
    if(res.isFinal){
      gotFinal=true;
      const alts=Array.from(res).map(a=>a.transcript);
      const r=judgeSpeech(alts,curItem().tl);
      r.said=alts[0];r.viaSpeech=true;
      stopListen();finishAnswer(r);
    }
  };
  rec.onerror=e=>{
    const err=e.error;listening=false;setMic(false);
    if(err==='not-allowed'||err==='service-not-allowed'){
      setLive('','Мікрофон заблоковано. Дозвольте доступ у браузері (значок біля адреси) або відкрийте сторінку в окремій вкладці Chrome/Edge. Можна перейти на «Не можу говорити зараз».');
    }else if(err==='no-speech'){setLive('','Не почув голосу. Натисніть на мікрофон і спробуйте ще раз.');}
    else if(err==='audio-capture'){setLive('','Мікрофон не знайдено. Перевірте, чи він підключений.');}
    else if(err==='network'){setLive('','Немає зв’язку із сервісом розпізнавання. Перевірте інтернет.');}
    else if(err!=='aborted'){setLive('','Не вдалося розпізнати. Спробуйте ще раз.');}
  };
  rec.onend=()=>{
    listening=false;setMic(false);
    if(!gotFinal&&$('#live')&&!$('#live').textContent.replace('…','')){setLive(undefined,'Не почув голосу. Натисніть на мікрофон і спробуйте ще раз.');}
  };
  try{rec.start();}catch(e){setLive('','Не вдалося запустити мікрофон. Спробуйте ще раз.');}
}

/* ---------- on-screen keyboard: lift the bottom button above it ---------- */
(function(){
  const vv=window.visualViewport;if(!vv)return;
  let raf=0;
  const upd=()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const kb=vv.scale>1.01?0:Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
      const open=kb>80;
      document.documentElement.style.setProperty('--kb',(open?kb:0)+'px');
      document.documentElement.classList.toggle('kb',open);
      if(view==='lesson'){const dk=$('.dock');if(dk)app.style.paddingBottom=dk.offsetHeight+'px';}
    });
  };
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);window.addEventListener('orientationchange',upd);upd();
})();

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown',e=>{
  if(view!=='lesson'||!L)return;
  const tag=document.activeElement&&document.activeElement.tagName;
  if(e.key==='Enter'&&!e.shiftKey&&tag!=='BUTTON'){
    const p=$('#primary');if(p&&!p.disabled){e.preventDefault();p.click();}
  }else if(e.key===' '&&L.stage==='ask'&&speakMode()&&tag!=='BUTTON'&&tag!=='TEXTAREA'){
    e.preventDefault();toggleMic();
  }
});

document.addEventListener('visibilitychange',()=>{if(loggedIn())syncNow();});
applyTheme();
render();
if(loggedIn())syncNow();
})();
</script>
