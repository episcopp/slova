name: Hourly word notification

on:
  schedule:
    # GitHub often skips scheduled runs, so run often; the script itself sends at most once per ~hour per user.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}    # lets you run it manually from the Actions tab to test

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin
        run: npm install firebase-admin@12 --no-save
      - name: Send hourly word
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}  # manual run ignores 08-22 hours
        run: node scripts/send-hourly-word.js
